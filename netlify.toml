[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_OPTIONS = "--max_old_space_size=4096"

[[headers]]
  for = "/api/v1/*/avatar/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/v1/*/avatar/"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El preview de React s'executa en un iframe aïllat (origen "null"): els seus scripts de mòdul
# es demanen amb CORS. Són els mateixos fitxers públics que carrega l'aplicació.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/api/*"
  to = "https://algorien.com/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200