[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_OPTIONS = "--max_old_space_size=4096"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://algorien.com; font-src 'self' data:; connect-src 'self' https://algorien.com; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; manifest-src 'self'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/teacher/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/profile"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/notifications"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/v1/*/avatar/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/api/v1/*/avatar/"
  [headers.values]
    Cache-Control = "private, no-store"

# El preview de React s'executa en un iframe aïllat (origen "null"): els seus scripts de mòdul
# es demanen amb CORS. Són els mateixos fitxers públics que carrega l'aplicació.
# Els fitxers de /assets/ porten un hash del contingut al nom (Vite): si canvien, canvia el nom,
# així que el navegador els pot guardar un any sense tornar a preguntar (Monaco inclòs).
# index.html NO: s'ha de revalidar sempre perquè apunti als fitxers nous de cada desplegament.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# Pyodide (Python del botó "Executar"): la versió és a la ruta (/pyodide/v<versió>/),
# així que també es pot guardar un any. Vegeu vite.config.ts.
[[headers]]
  for = "/pyodide/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/*"
  to = "https://algorien.com/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200